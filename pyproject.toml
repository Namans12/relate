[project]
name = "patch-precedent"
version = "0.1.0"
description = "Replay patches against an upstream installer test harness and explain the results via a graph."
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "jinja2==3.1.6",
    "mcp==2.3.0",
    "relate-db==1.1.0",
    "rich==15.0.0",
]

[project.scripts]
patch-precedent = "patch_precedent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patch_precedent"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "-m 'not upstream'"
markers = ["upstream: needs the upstream checkout and network"]
